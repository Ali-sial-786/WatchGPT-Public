name: WatchGPT checks and APKs

on:
  pull_request:
  push:
    branches: [main, watchgpt/setup]
  workflow_dispatch:
    inputs:
      android_only:
        description: Run only Android integration and screen capture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # Private draft APK delivery after verification; checkout credentials are disabled.
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
      - name: Restore private sideload signing identity
        env:
          WATCHGPT_SIGNING_KEYSTORE: ${{ secrets.WATCHGPT_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$WATCHGPT_SIGNING_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$WATCHGPT_SIGNING_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo "No persistent signing secret: this run generates a matching test pair; future runs may require reinstall."
          fi
      - name: Build, test, lint
        run: ./gradlew spotlessCheck checkSyntheticFixtures test testDebugUnitTest lintDebug assembleDebug assembleRelease cyclonedxBom --console=plain
      - name: 16 KB page alignment
        run: $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk > /dev/null
      - name: Verify matching installation identity and signing certificate
        run: |
          PHONE=app/build/outputs/apk/release/app-release.apk
          WATCH=wear/build/outputs/apk/release/wear-release.apk
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK/apksigner" verify --print-certs "$PHONE" > phone-cert.txt
          "$SDK/apksigner" verify --print-certs "$WATCH" > watch-cert.txt
          diff <(grep 'certificate SHA-256 digest:' phone-cert.txt) <(grep 'certificate SHA-256 digest:' watch-cert.txt)
          "$SDK/zipalign" -c -P 16 -v 4 "$WATCH" > /dev/null
      - name: Checksums
        run: sha256sum app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk > apk.sha256
      - name: Deliver verified APK pair in a private draft release
        if: github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/WatchGPT-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk delivery/WatchGPT-watch.apk
          cp docs/getting-started.md delivery/INSTALL.md
          cp docs/WATCHGPT_BEHAVIOR.md delivery/BEHAVIOR.md
          (cd delivery && sha256sum WatchGPT-phone.apk WatchGPT-watch.apk > SHA256SUMS)
          {
            echo "Private sideload pair built from commit $GITHUB_SHA."
            echo
            echo "Download both APKs from this same release. Follow INSTALL.md and verify SHA256SUMS."
            echo "Live ChatGPT voice uses Buddy's undocumented account endpoint and remains unverified on the owner's devices."
            echo "Manual reminders work without ChatGPT or a hosted database."
            echo
            echo "Shared signing certificate:"
            grep 'certificate SHA-256 digest:' phone-cert.txt
            echo
            echo "Without the optional persistent CI signing secret, this pair can have a different certificate from the local handoff or later runs; do not mix pairs."
          } > delivery/RELEASE-NOTES.md
          gh release create "watchgpt-build-$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "WatchGPT private sideload $GITHUB_RUN_ID" \
            --notes-file delivery/RELEASE-NOTES.md delivery/WatchGPT-phone.apk delivery/WatchGPT-watch.apk \
            delivery/SHA256SUMS delivery/INSTALL.md delivery/BEHAVIOR.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        with:
          name: WatchGPT-phone-and-watch-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
            apk.sha256
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/reports/cyclonedx/**
          retention-days: 90

  secrets:
    permissions:
      contents: read
      pull-requests: read
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  sast:
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: mobsfscan
        run: |
          pip install --require-hashes --no-deps -r .github/requirements-ci.txt
          mobsfscan --sarif -o mobsfscan.sarif . || true
          mobsfscan --json -o mobsfscan.json .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: always()
        with:
          name: mobsfscan-${{ github.sha }}
          path: mobsfscan.*
          retention-days: 90

  osv:
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan dependencies (results remain in the job log)
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: --format=table -r ./

  commits:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No AI attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git log --format=%B "$BASE..$HEAD" | grep -i -E 'co-authored-by|generated with'; then
            echo "Commit messages must not carry co-author or generator lines." && exit 1
          fi

  android-integration:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :core:organizer:connectedDebugAndroidTest --console=plain --max-workers=2 || (python tools/print-android-test-results.py; mkdir -p docs/screenshots; adb pull /sdcard/Pictures/WatchGPT_Demos/. docs/screenshots/ || true; exit 1)
            python tools/print-android-test-results.py
            mkdir -p docs/screenshots
            adb pull /sdcard/Pictures/WatchGPT_Demos/. docs/screenshots/
      - name: Save synthetic screenshots to the private preview branch
        if: always() && github.event.repository.private && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/watchgpt/setup' || (github.event_name == 'pull_request' && github.head_ref == 'watchgpt/setup' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! compgen -G "docs/screenshots/*.png" > /dev/null; then exit 0; fi
          gh auth setup-git
          git config user.name "WatchGPT CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "watchgpt/screenshots-$GITHUB_RUN_ID"
          git add docs/screenshots/*.png
          git diff --cached --quiet || git commit -m "Capture WatchGPT reminder screens on Android emulator"
          git push origin "HEAD:watchgpt/screenshots-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: always()
        with:
          name: android-integration-${{ github.sha }}
          path: |
            core/organizer/build/reports/androidTests/**
            core/organizer/build/outputs/androidTest-results/**
          retention-days: 30
