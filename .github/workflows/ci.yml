name: WatchGPT checks and APKs

on:
  pull_request:
  push:
    branches: [main, watchgpt/setup]
  workflow_dispatch:
    inputs:
      android_only:
        description: Run only Android integration and screen capture
        type: boolean
        default: false
      save_screenshots:
        description: Save the captured screens to a private watchgpt/screenshots-<run> branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # Private draft APK delivery after verification; checkout credentials are disabled.
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
      # The long-term key only for main builds: branch and pull request builds run code that isn't on main yet.
      - name: Restore private sideload signing identity
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WATCHGPT_SIGNING_KEYSTORE: ${{ secrets.WATCHGPT_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$WATCHGPT_SIGNING_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$WATCHGPT_SIGNING_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No WATCHGPT_SIGNING_KEYSTORE secret: this pair has a fresh signing key, so it can't update an installed WatchGPT. See docs/getting-started.md, Signing."
          fi
      - name: Build, test, lint
        run: ./gradlew spotlessCheck checkSyntheticFixtures test testDebugUnitTest lintDebug assembleDebug assembleRelease cyclonedxBom --console=plain
      - name: 16 KB page alignment
        run: $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk > /dev/null
      - name: Classes native code looks up by name survive shrinking
        # WebRTC's native library aborts the app on the first call if one is missing.
        run: |
          unzip -p app/build/outputs/apk/release/app-release.apk 'classes*.dex' > "$RUNNER_TEMP/release.dex"
          for class in 'Lorg/jni_zero/JniZero;' 'Lorg/webrtc/PeerConnectionFactory;'; do
            grep -a -F -q "$class" "$RUNNER_TEMP/release.dex" || { echo "::error::$class is missing from the release APK"; exit 1; }
          done
      - name: Verify matching installation identity and signing certificate
        run: |
          PHONE=app/build/outputs/apk/release/app-release.apk
          WATCH=wear/build/outputs/apk/release/wear-release.apk
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK/apksigner" verify --print-certs "$PHONE" > phone-cert.txt
          "$SDK/apksigner" verify --print-certs "$WATCH" > watch-cert.txt
          diff <(grep 'certificate SHA-256 digest:' phone-cert.txt) <(grep 'certificate SHA-256 digest:' watch-cert.txt)
          "$SDK/zipalign" -c -P 16 -v 4 "$WATCH" > /dev/null
      - name: Checksums
        run: sha256sum app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk > apk.sha256
      # Every push to main with the persistent key; without it only when run by hand, since a pair with a fresh key
      # can only be installed by uninstalling, which deletes the reminders on that device. A draft release stays
      # visible only to people who can push, also in a public repository.
      - name: Deliver verified APK pair in a private draft release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (steps.signing.outputs.persistent == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSISTENT: ${{ steps.signing.outputs.persistent }}
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/WatchGPT-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk delivery/WatchGPT-watch.apk
          cp docs/getting-started.md delivery/INSTALL.md
          cp docs/WATCHGPT_BEHAVIOR.md delivery/BEHAVIOR.md
          (cd delivery && sha256sum WatchGPT-phone.apk WatchGPT-watch.apk > SHA256SUMS)
          CERT=$(grep -m1 'certificate SHA-256 digest:' phone-cert.txt | awk '{print $NF}')
          if [ "$PERSISTENT" = "true" ]; then KEY="updates installed pairs with certificate ${CERT:0:12}"; else KEY="FRESH signing key: install only where WatchGPT isn't installed"; fi
          {
            echo "Private sideload pair built from commit $GITHUB_SHA ($KEY)."
            echo
            echo "Download both APKs from this same release. Follow INSTALL.md and verify SHA256SUMS."
            echo "Live ChatGPT voice uses an undocumented ChatGPT account endpoint and remains unverified on the owner's devices."
            echo "Manual reminders work without ChatGPT or a hosted database."
            echo
            echo "Shared signing certificate: $CERT"
            if [ "$PERSISTENT" != "true" ]; then
              echo
              echo "This pair was signed with a key made for this run. Android refuses it as an update to WatchGPT installed from another pair;"
              echo "uninstalling deletes that device's reminders. Set the WATCHGPT_SIGNING_KEYSTORE secret (INSTALL.md, Signing) to make updates work."
            fi
          } > delivery/RELEASE-NOTES.md
          gh release create "watchgpt-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "WatchGPT ${GITHUB_SHA:0:7} · key ${CERT:0:12}" \
            --notes-file delivery/RELEASE-NOTES.md delivery/WatchGPT-phone.apk delivery/WatchGPT-watch.apk \
            delivery/SHA256SUMS delivery/INSTALL.md delivery/BEHAVIOR.md
          # Keep the newest two drafts (about 100 MB each); older ones only use storage.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft and (.tag_name | startswith("watchgpt-build-"))) | .id' \
            | tail -n +3 | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
      # Short-lived: a private repository has little artifact storage, and main gets its pair as a draft release.
      # In a public repository anyone signed in can download artifacts, so main's pair, signed with the owner's key,
      # only goes to the draft release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: github.event.repository.private || github.ref != 'refs/heads/main'
        with:
          name: WatchGPT-phone-and-watch-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
            apk.sha256
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: failure()
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/reports/cyclonedx/**
          retention-days: 7

  secrets:
    permissions:
      contents: read
      pull-requests: read
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  sast:
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: mobsfscan
        run: |
          pip install --require-hashes --no-deps -r .github/requirements-ci.txt
          mobsfscan --sarif -o mobsfscan.sarif . || true
          mobsfscan --json -o mobsfscan.json .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: always()
        with:
          name: mobsfscan-${{ github.sha }}
          path: mobsfscan.*
          retention-days: 90

  osv:
    if: (github.event_name != 'workflow_dispatch' || !inputs.android_only) && (github.event_name != 'push' || github.ref != 'refs/heads/watchgpt/setup')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan dependencies (results remain in the job log)
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: --format=table -r ./

  commits:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No AI attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git log --format=%B "$BASE..$HEAD" | grep -i -E 'co-authored-by|generated with'; then
            echo "Commit messages must not carry co-author or generator lines." && exit 1
          fi

  android-integration:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
      - name: Free disk space for the emulator
        # The API 35 image needs about 7.4 GB free for its data partition, which the runner no longer always has.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          df -h "$HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :core:organizer:connectedDebugAndroidTest --console=plain --max-workers=2 || (python tools/print-android-test-results.py; mkdir -p "$RUNNER_TEMP/shots"; adb pull /sdcard/Pictures/WatchGPT_Demos/. "$RUNNER_TEMP/shots/" || true; exit 1)
            python tools/print-android-test-results.py
            mkdir -p "$RUNNER_TEMP/shots"
            adb pull /sdcard/Pictures/WatchGPT_Demos/. "$RUNNER_TEMP/shots/"
      - name: Save synthetic screenshots to the private preview branch
        # Only when asked for: every saved run is another branch in the repository.
        if: ${{ !cancelled() && github.event.repository.private && ((github.event_name == 'workflow_dispatch' && inputs.save_screenshots) || github.ref == 'refs/heads/watchgpt/setup' || (github.event_name == 'pull_request' && github.head_ref == 'watchgpt/setup' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only what this run captured (the checkout already has older screens).
          if ! compgen -G "$RUNNER_TEMP/shots/*.png" > /dev/null; then exit 0; fi
          mkdir -p docs/screenshots
          cp "$RUNNER_TEMP"/shots/*.png docs/screenshots/
          gh auth setup-git
          git config user.name "WatchGPT CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "watchgpt/screenshots-$GITHUB_RUN_ID"
          git add docs/screenshots/*.png
          git diff --cached --quiet || git commit -m "Capture WatchGPT reminder screens on Android emulator"
          git push origin "HEAD:watchgpt/screenshots-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true # Preserve check results when the account artifact quota is full.
        if: failure()
        with:
          name: android-integration-${{ github.sha }}
          path: |
            core/organizer/build/reports/androidTests/**
            core/organizer/build/outputs/androidTest-results/**
          retention-days: 7
